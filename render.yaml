services:
  - type: web
    name: life-rpg-backend
    env: node
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: life-rpg-db
          property: connectionString

databases:
  - name: life-rpg-db
    databaseName: def_life_rpg
    user: life_rpg_user
